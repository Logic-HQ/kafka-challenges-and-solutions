version: '3.8'

services:
  # 1. Zookeeper: Coordination service for Apache Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  # 2. Apache Kafka: The central event backbone
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # 3. MySQL Database with custom binlog tracking parameters
  mysql-primary:
    image: mysql:8.0
    ports:
      - "3306:3306"
    volumes:
      - ./mysql.cnf:/etc/mysql/conf.d/source.cnf
    environment:
      MYSQL_ROOT_PASSWORD: root_secure_password
      MYSQL_DATABASE: bank_services
      MYSQL_USER: debezium_user
      MYSQL_PASSWORD: your_secure_password

  # 4. Redis distributed key store for consumer idempotency tracking
  redis-cache:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"

  # 5. Debezium Connect platform
  debezium:
    image: debezium/connect:2.4
    ports:
      - "8083:8083"
    depends_on:
      - kafka
      - mysql-primary
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: my_connect_configs
      OFFSET_STORAGE_TOPIC: my_connect_offsets
      STATUS_STORAGE_TOPIC: my_connect_statuses

  # 6. Your Custom Go consumer application container
  go-app:
    image: golang:1.21-alpine
    depends_on:
      - kafka
      - redis-cache
    volumes:
      - .:/app
    working_dir: /app
    command: sh -c "go mod init app && go get ://github.com ://github.com && go run main.go"
    environment:
      KAFKA_BROKERS: "kafka:29092"
      REDIS_ADDR: "redis-cache:6379"
